[phases.setup]
aptPkgs = ["libatomic1"]

[phases.build]
cmds = [
    "composer install --no-dev --optimize-autoloader",
    "npm install",
    "npm run build"
]

[start]
command = "php -d expose_php=Off artisan storage:link --force ; php -d expose_php=Off artisan serve --host=0.0.0.0 --port=${PORT:-8080}"
