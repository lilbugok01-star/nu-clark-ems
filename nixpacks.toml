[phases.setup]
aptPkgs = ["libatomic1"]

[phases.build]
cmds = [
    "composer update --no-dev --optimize-autoloader --no-interaction",
    "npm install",
    "npm run build"
]

[start]
command = "php artisan config:cache && php artisan route:cache && php artisan view:cache && php artisan migrate --force && php artisan db:seed --force && php artisan serve --host=0.0.0.0 --port=$PORT"
