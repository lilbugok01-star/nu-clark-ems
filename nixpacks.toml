[phases.setup]
nixPkgs = ["...", "libgd", "libpng", "libjpeg", "zlib"]

[phases.install]
dependsOn = ["setup"]
cmds = ["composer install --no-interaction --optimize-autoloader"]

[phases.build]
dependsOn = ["install"]
cmds = ["npm install", "npm run build"]

[start]
cmd = "php artisan migrate --force && php artisan config:cache && php artisan route:cache && php artisan view:cache && php-fpm -D && nginx -g 'daemon off;'"
