[phases.setup]
nixPkgs = ["...", "libgd", "libpng", "libjpeg", "zlib"]

[phases.install]
dependsOn = ["setup"]
cmds = ["composer install --no-interaction --optimize-autoloader"]

[phases.build]
dependsOn = ["install"]
cmds = ["npm install", "npm run build"]

[start]
cmd = "php artisan migrate --force && php artisan serve --host 0.0.0.0 --port $PORT"
